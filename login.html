<title>مداد | مجموعة ألفا الاستشارية</title>

<style>
:root {
  --navy:#1C2653; --navy2:#2a3875; --accent:#0AAED0;
  --bg:#F0F4FA; --card:#fff; --border:#D6DEF0;
  --text:#1C2653; --muted:#6B7A9E;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{width:100%;max-width:420px;animation:up .5s ease both}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.brand{text-align:center;margin-bottom:32px}
.brand h1{font-size:22px;font-weight:900;color:var(--text);margin-bottom:4px}
.brand h1 span{color:var(--accent)}
.brand p{font-size:13px;color:var(--muted)}
.card{background:var(--card);border-radius:20px;border:1px solid var(--border);box-shadow:0 8px 40px rgba(28,38,83,.12);overflow:hidden}
.card-top{background:linear-gradient(135deg,var(--navy),var(--navy2));padding:20px 24px;display:flex;align-items:center;gap:12px}
.card-top-icon{width:44px;height:44px;border-radius:11px;background:rgba(255,255,255,.13);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.card-top h2{color:#fff;font-size:15px;font-weight:700}
.card-top p{color:rgba(255,255,255,.62);font-size:12px;margin-top:2px}
.card-body{padding:28px 24px 24px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:6px}
.field input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:'Cairo',sans-serif;font-size:13.5px;color:var(--text);background:var(--bg);transition:all .18s}
.field input[type=email]{direction:ltr;text-align:left;unicode-bidi:embed}
.field input:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(78,153,211,.14)}
.btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border:none;border-radius:11px;font-family:'Cairo',sans-serif;font-size:14.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 18px rgba(28,38,83,.28);transition:all .18s;margin-top:4px}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 7px 24px rgba(28,38,83,.38)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.spin{display:none;width:18px;height:18px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .65s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.alert{display:none;align-items:flex-start;gap:8px;padding:11px 13px;border-radius:9px;font-size:13px;margin-top:14px;line-height:1.55}
.alert.show{display:flex}
.err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c}
.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d}
.footer{text-align:center;font-size:11.5px;color:var(--muted);margin-top:18px}
</style>
</head>

        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" style="direction:ltr;text-align:left;">
      </div>
      <button class="btn" id="loginBtn" onclick="login()">
        <div class="spin" id="spinner"></div>
        <span id="btnText">دخول ←</span>
      </button>
      <div class="alert err" id="errAlert"><span>❌</span><span id="errMsg"></span></div>
      <div class="alert ok"  id="okAlert"><span>✅</span><span>تم تسجيل الدخول! جارٍ التحويل...</span></div>
    </div>
  </div>
  <div class="footer">🔒 جميع البيانات محمية ومشفرة | مجموعة ألفا الاستشارية</div>
</div>
<script>
let sb;

(async()=>{
  const cfg=await fetch('/.netlify/functions/app-config').then(r=>r.json());
  sb=supabase.createClient(cfg.url,cfg.key);
  const {data:{session}}=await sb.auth.getSession();
  if(session) goHome(session);
})();

async function login() {
  if(!sb){ showErr('جارٍ التهيئة، حاول مجدداً'); return; }
  const email = document.getElementById('email').value.trim();
  const pass  = document.getElementById('password').value;
  document.getElementById('errAlert').classList.remove('show');
  document.getElementById('okAlert').classList.remove('show');
  if(!email||!pass){ showErr('يرجى إدخال البريد الإلكتروني وكلمة المرور'); return; }
  setLoad(true);
  const {data,error} = await sb.auth.signInWithPassword({email,password:pass});
  setLoad(false);
  if(error){ showErr('البريد الإلكتروني أو كلمة المرور غير صحيحة'); return; }
  document.getElementById('okAlert').classList.add('show');
  setTimeout(()=>goHome(data.session),1000);
}

function goHome(s) {
  const role = s?.user?.user_metadata?.role;
  window.location.href = role==='admin' ? 'admin.html' : 'app.html';
}

function setLoad(on) {
  document.getElementById('loginBtn').disabled = on;
  document.getElementById('spinner').style.display = on?'block':'none';
  document.getElementById('btnText').textContent = on?'جارٍ الدخول...':'دخول ←';
}

function showErr(m) {
  document.getElementById('errMsg').textContent = m;
  document.getElementById('errAlert').classList.add('show');
}

document.addEventListener('keydown', e=>{ if(e.key==='Enter') login(); });
</script>
</body>
</html>
