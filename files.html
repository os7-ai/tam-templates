<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مداد | نماذج وملفات</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='2' width='13' height='13' rx='3' fill='%234FCDE8'/><rect x='2' y='17' width='13' height='13' rx='3' fill='%230AAED0'/><rect x='17' y='17' width='13' height='13' rx='3' fill='%230AAED0'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--navy:#1C2653;--navy2:#2a3875;--sb1:#0a0e2c;--sb2:#1a2450;--accent:#0AAED0;--bg:#F0F4FA;--card:#fff;--border:#D6DEF0;--text:#1C2653;--muted:#6B7A9E}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;background:var(--bg);min-height:100vh;direction:rtl}

/* ── Sidebar ─────────────────────────────────────── */
.sidebar{position:fixed;top:0;right:0;bottom:0;width:240px;background:linear-gradient(195deg,var(--sb1),var(--sb2));display:flex;flex-direction:column;z-index:100;box-shadow:-2px 0 28px rgba(4,6,20,.28)}
.sb-brand{display:flex;align-items:center;gap:11px;padding:24px 20px 20px;cursor:pointer;flex-shrink:0}
.sb-brand svg{flex-shrink:0}
.sb-brand-text{display:flex;flex-direction:column;min-width:0}
.sb-brand-name{color:#fff;font-size:17px;font-weight:900;letter-spacing:.2px}
.sb-brand-org{color:rgba(255,255,255,.5);font-size:10.5px;font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-glow{height:1px;margin:0 20px 14px;background:linear-gradient(90deg,transparent,var(--accent) 50%,transparent);opacity:.5;flex-shrink:0}
.sb-nav{flex:1;padding:4px 12px 16px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.sb-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:11px;color:rgba(255,255,255,.68);text-decoration:none;font-size:13.5px;font-weight:700;font-family:'Tajawal',sans-serif;transition:all .2s cubic-bezier(.4,0,.2,1);background:none;border:none;width:100%;text-align:right;cursor:pointer}
.sb-item:hover{background:rgba(255,255,255,.07);color:#fff}
.sb-item.active{background:linear-gradient(135deg,var(--accent),#0a86a3);color:#fff;box-shadow:0 4px 16px rgba(10,174,208,.4)}
.sb-icon{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:rgba(255,255,255,.85)}
.sb-item:hover .sb-icon{color:#fff}
.sb-item.active .sb-icon{background:rgba(255,255,255,.22);color:#fff}
.sb-label{flex:1;min-width:0}
.sb-item.disabled{opacity:.4;cursor:not-allowed}
.sb-item.disabled:hover{background:none;color:rgba(255,255,255,.68)}
.sb-item.disabled .sb-icon{color:rgba(255,255,255,.6)}
.sb-soon{font-size:9px;font-weight:700;background:transparent;border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.75);padding:2px 7px;border-radius:20px;flex-shrink:0}
.sb-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08);flex-shrink:0}
.sb-profile{display:flex;align-items:center;gap:9px}
.sb-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#0a86a3);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0}
.sb-profile-text{flex:1;min-width:0;display:flex;flex-direction:column}
.sb-profile-name{color:#fff;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-profile-org{color:rgba(255,255,255,.5);font-size:10px;margin-top:1px}
.sb-logout-icon{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .18s}
.sb-logout-icon:hover{background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.4);color:#fca5a5}
.app-main{margin-right:240px;min-height:100vh}
@media(max-width:860px){
  .sidebar{width:72px}
  .sb-brand-text,.sb-label,.sb-soon,.sb-glow,.sb-profile-text{display:none}
  .sb-brand{justify-content:center;padding:20px 0}
  .sb-item{justify-content:center;padding:11px}
  .sb-profile{flex-direction:column;gap:8px}
  .app-main{margin-right:72px}
}
/* ── Topbar ─────────────────────────────────────── */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px 28px 0}
.topbar-search{flex:0 1 420px;min-width:0;display:flex;align-items:center;gap:9px;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:9px 14px;color:var(--muted)}
.topbar-search input{border:none;background:none;outline:none;flex:1;font-family:'Tajawal',sans-serif;font-size:13px;color:var(--text)}
.topbar-search svg{flex-shrink:0}
.topbar-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.topbar-bell{width:38px;height:38px;border-radius:10px;background:var(--card);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:not-allowed;flex-shrink:0}
.topbar-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}

.main{max-width:720px;margin:0 auto;padding:24px 20px 56px}
.page-hero{text-align:center;margin-bottom:36px}
.page-hero h2{font-size:22px;font-weight:900;color:var(--text);margin-bottom:8px}
.page-hero p{font-size:13.5px;color:var(--muted)}
.empty{background:var(--card);border:1.5px dashed var(--border);border-radius:18px;padding:48px 24px;text-align:center}
.empty-icon{width:64px;height:64px;background:var(--bg);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 18px}
.empty h3{font-size:15px;font-weight:800;color:var(--text);margin-bottom:8px}
.empty p{font-size:13px;color:var(--muted);line-height:1.7;max-width:380px;margin:0 auto}
</style>
</head>
<body>
<div class="sidebar">
  <div class="sb-brand" onclick="location.href='home.html'">
    <svg width="30" height="30" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <rect x="1" y="1" width="13" height="13" rx="3.5" fill="#4FCDE8"/>
      <rect x="1" y="17" width="13" height="13" rx="3.5" fill="#0AAED0"/>
      <rect x="17" y="17" width="13" height="13" rx="3.5" fill="#0AAED0"/>
    </svg>
    <div class="sb-brand-text">
      <span class="sb-brand-name">مداد</span>
      <span class="sb-brand-org">Alpha Consulting Group</span>
    </div>
  </div>
  <div class="sb-glow"></div>
  <nav class="sb-nav">
    <div class="sb-item disabled" title="قريباً">
      <span class="sb-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg></span><span class="sb-label">مراجعة المحتوى المحلي</span><span class="sb-soon">قريباً</span>
    </div>
    <a class="sb-item" href="app.html"><span class="sb-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg></span><span class="sb-label">إعداد مستند</span></a>
    <a class="sb-item" href="classifier.html"><span class="sb-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 11 3.83A2 2 0 0 0 9.59 3.24L3 3v6.59a2 2 0 0 0 .59 1.41l9.58 9.58a2 2 0 0 0 2.83 0l4.59-4.59a2 2 0 0 0 0-2.83z"/><circle cx="7.5" cy="7.5" r="1.3" fill="currentColor" stroke="none"/></svg></span><span class="sb-label">تصنيف مورد</span></a>
    <a class="sb-item" href="correspondence.html"><span class="sb-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><polyline points="3 7 12 13 21 7"/></svg></span><span class="sb-label">نماذج مراسلات</span></a>
    <a class="sb-item active" href="files.html"><span class="sb-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span><span class="sb-label">نماذج وملفات</span></a>
  </nav>
  <div class="sb-foot">
    <div class="sb-profile">
      <div class="sb-avatar" id="sbAvatar">؟</div>
      <div class="sb-profile-text">
        <span class="sb-profile-name" id="sbName">...</span>
        <span class="sb-profile-org">Alpha Consulting</span>
      </div>
      <button class="sb-logout-icon" onclick="logout()" title="تسجيل خروج">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="app-main">
<div class="topbar">
  <div class="topbar-search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="topSearch" placeholder="بحث عن قالب...">
  </div>
  <div class="topbar-actions">
    <button class="topbar-bell" title="الإشعارات — قريباً">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
    </button>
    <div class="topbar-avatar" id="topAvatar">؟</div>
  </div>
</div>
  <div class="main">
    <div class="page-hero">
      <h2>نماذج وملفات</h2>
      <p>ملفات وقوالب جاهزة للتحميل المباشر</p>
    </div>
    <div class="empty">
      <div class="empty-icon">🗂️</div>
      <h3>لا توجد ملفات بعد</h3>
      <p>سيتم إضافة النماذج والملفات القابلة للتحميل هنا قريباً.</p>
    </div>
  </div>
</div>

<script>
let sb;
function initials(email){
  const local=(email||'').split('@')[0];
  const parts=local.split(/[._-]+/).filter(Boolean);
  if(parts.length>=2) return (parts[0][0]+parts[1][0]).toUpperCase();
  return local.slice(0,2).toUpperCase();
}
function displayName(email){
  const local=(email||'').split('@')[0];
  const parts=local.split(/[._-]+/).filter(Boolean).map(p=>p[0].toUpperCase()+p.slice(1));
  return parts.join(' ')||email||'';
}
(async()=>{
  const cfg=await fetch('/.netlify/functions/app-config').then(r=>r.json());
  sb=supabase.createClient(cfg.url,cfg.key);
  const {data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='login.html';return;}
  const email=session.user.email;
  document.getElementById('sbAvatar').textContent=initials(email);
  document.getElementById('topAvatar').textContent=initials(email);
  document.getElementById('sbName').textContent=displayName(email);
})();
function logout(){if(sb)sb.auth.signOut().then(()=>window.location.href='login.html');}
document.getElementById('topSearch').addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const q=e.target.value.trim();
    location.href='app.html'+(q?('?q='+encodeURIComponent(q)):'');
  }
});
</script>
</body>
</html>
